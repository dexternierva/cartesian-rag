<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CartesianRAG high-fidelity prototype: an assistant that answers from a store's own tables, replaying real engine answers. Part of a UX and design-engineering case study by Dex.">
<title>CartesianRAG Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: facilitator bar on top; each task view is a full working screen (storefront + floating assistant, or tri-pane console).
   Look: HIGH FIDELITY, from the CartesianRAG design system (Daylight theme): forest green primary, lantern yellow
   secondary, campfire red as a rare accent (promo tags only), brown neutrals, separate status colours, receipts on paper.
   The old token names are kept so every rule below picks up the new values. */
:root{
  --bg:#faf6ef; --surface:#fffdf9; --surface-2:#f1e9dd; --line:#e2d7c8; --line-strong:#8a7765;
  --ink:#2b2118; --ink-2:#6a5847; --primary:#2f6b3b; --primary-ink:#ffffff;
  --accent:#2f6b3b; --accent-hover:#245530; --accent-ink:#ffffff; --accent-soft:#e2eedf;
  --lantern:#f2c14e; --lantern-soft:#fbecc6; --on-lantern:#2b2118; --campfire:#c8452b; --on-campfire:#ffffff;
  --ok:#1d6782; --ok-soft:#ddeef4; --warn:#8a5a00; --warn-soft:#f7ead0; --bad:#a3203f; --bad-soft:#f6dfe3;
  --receipt-paper:#fffaf0; --receipt-edge:#8a7765; --receipt-check:#2f6b3b;
  --scrim:rgba(43,33,24,.32);
  --shadow-card:0 1px 2px #2b21180f, 0 2px 8px #2b21180a; --shadow-pop:0 12px 32px #2b211829, 0 2px 6px #2b211814;
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
.btn,.chip,.card,.facet,.tile,.search,.kpi,.kv,.action,.trackcard,.pick{border-width:1.5px}
.dot.warn{background:transparent!important;border:2px solid var(--ink)}
.dot.bad{background:transparent!important;border:2px dashed var(--ink)}
.store-scrim{position:fixed;inset:0;z-index:22;background:var(--scrim)}
.bar{background:#D9D9D6;border-radius:4px;max-width:100%}
.bar.l{background:var(--surface-2)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-size:12px}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.cite{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--accent);border-radius:4px;background:transparent;color:var(--accent);font-family:var(--font-mono);font-size:11px;min-height:28px}
.cite:hover{background:var(--accent-soft)}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:8px}
.iconbtn:hover{background:var(--surface-2)}

/* facilitator bar */
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:3px solid var(--accent);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px;background:var(--primary);color:var(--primary-ink);font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--primary)}
.fbar b{letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.fbar .sp{flex-grow:1}
.fbar button{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;font-size:12px;font-weight:600}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.logpanel{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));width:min(380px,calc(100% - 32px));max-height:60vh;display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;}
.logpanel ol{margin:0;padding:8px 16px 8px 40px;overflow:auto;font-size:12px;font-family:var(--font-mono)}

/* start */
.start{max-width:960px;margin:0 auto;padding-block:48px 64px;display:flex;flex-direction:column;gap:28px}
.start h1{font-size:34px;line-height:1.15;letter-spacing:-.02em}
.start p.lead{font-size:16px;color:var(--ink-2);max-width:62ch;margin:0}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.task{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.task .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.task h2{font-size:20px}
.task blockquote{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:8px;font-size:14px;line-height:1.5}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.rules li{padding:12px 14px;border:1px dashed var(--line-strong);border-radius:8px;font-size:13px;color:var(--ink-2)}

/* storefront */
.store-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:112px;height:36px;border:1.5px solid var(--line-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.store-h nav{display:flex;gap:18px;font-size:14px;color:var(--ink-2)}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink-2)}
.store-body{display:flex;flex-wrap:wrap;gap:24px;padding-block:24px 120px;max-width:1280px;margin:0 auto}
.filters{flex:1 1 220px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.facet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.catalog{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ph{background:var(--surface-2);border-radius:6px;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.launcher{position:fixed;z-index:20;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--primary);color:var(--primary-ink);font-weight:700;border:2px solid var(--primary)}

/* widget */
.widget{position:fixed;z-index:25;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));top:calc(var(--fbar-h,48px) + 16px + env(safe-area-inset-top,0px));width:min(440px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
@media (max-width:560px){.widget{right:0;left:0;bottom:0;width:100%;border-radius:0;top:calc(var(--fbar-h,48px) + env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}}
.w-h{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line)}
.w-h h2{flex-grow:1;font-size:15px}
.w-status{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.timeline{flex-grow:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.u{align-self:flex-end;max-width:85%;padding:10px 14px;background:var(--surface-2);border-radius:12px 12px 2px 12px}
.a{max-width:100%;display:flex;flex-direction:column;gap:10px}
.a p{margin:0}
.empty{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px}
.empty .stack{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.w-foot{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips .chip{flex-shrink:0}
.composer{display:flex;gap:8px}
.composer input{flex-grow:1;min-width:0;height:44px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}

/* product card */
.card{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.card.top{border-color:var(--ink)}
.card{border-radius:8px}
.card-h{display:flex;gap:12px}
.thumb{width:72px;height:72px;flex-shrink:0;border-radius:4px;border:1.5px solid var(--line-strong);background:linear-gradient(to top right,transparent calc(50% - 1px),#B5B5B1 50%,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),#B5B5B1 50%,transparent calc(50% + 1px)),var(--bg)}
.card-h .t{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.stock{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.stock.ok b{color:var(--ok)} .stock.warn b{color:var(--warn)} .stock.bad b{color:var(--bad)}
.stock .dot.warn{background:var(--warn)} .stock .dot.bad{background:var(--bad)}
.spec{padding:3px 8px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--ink-2)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden}
.stepper button{width:40px;height:40px;border:0;background:transparent;font-size:18px}
.stepper input{width:56px;height:40px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:700;background:var(--surface);font-variant-numeric:tabular-nums}
.warnbox{padding:8px 10px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--warn);font-size:13px}
.calc{padding:10px;border-radius:6px;background:var(--surface-2);font-family:var(--font-mono);font-size:12px;white-space:pre-wrap}
.linkbtn{align-self:flex-start;padding:4px 0;border:0;background:none;color:var(--accent);font-size:13px;text-decoration:underline;min-height:28px}
.confirm{border:1.5px solid var(--accent);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
.hold{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.hold .warnline{font-size:13px;font-weight:600}
.prog{display:flex;flex-direction:column;gap:12px}
.prog .steps li{padding-bottom:10px}
.prog .steps .m.now{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.prog .steps .m.now{animation:none}}
.lockbadge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:var(--surface-2);font-weight:600;font-size:13px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;gap:10px;padding-bottom:12px;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:6px;top:18px;bottom:2px;width:2px;background:var(--line)}
.steps .m{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:3px;border:2px solid var(--line-strong);background:var(--surface)}
.steps .m.done{background:var(--ok);border-color:var(--ok)}
.steps .m.now{border-color:var(--accent);background:var(--accent-soft)}
.skel{background:var(--surface-2);border-radius:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.matrix-wrap{border:1.5px solid var(--line);border-radius:10px;overflow-x:auto}
.matrix{width:100%;min-width:380px;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:8px 10px;text-align:left;border-top:1px solid var(--line)}
.matrix thead th{border-top:0;background:var(--surface-2);position:sticky;top:0}
.matrix tbody th{font-weight:500;color:var(--ink-2);position:sticky;left:0;background:var(--surface)}
.matrix tr.diff td{font-weight:600}
.pick{min-height:52px;padding:8px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.pick:hover{border-color:var(--accent)}
.notice{border:1.5px solid var(--ink);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}

/* drawer */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim)}
.drawer{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(28rem,100%);display:flex;flex-direction:column;background:var(--surface);border-left:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 20px;border-bottom:1px solid var(--line)}
.d-h h2{flex-grow:1;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.d-b{flex-grow:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;padding:0 14px;border:0;background:none;border-bottom:3px solid transparent;margin-bottom:-1px;font-size:13px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.kv{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border-top:1px solid var(--line)}
.kv div:first-child{border-top:0;background:var(--surface-2);font-weight:600}
.kv span{padding:7px 10px;font-size:12px;overflow-wrap:anywhere}
.kv div:not(:first-child) span{font-family:var(--font-mono)}
pre.sql{margin:0;padding:12px;border-radius:8px;background:var(--surface-2);font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.d-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.d-f .btn{flex:1 1 140px}
.label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* console */
.c-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px;background:var(--primary);color:var(--primary-ink);font-size:13px}
.c-h .dot{background:var(--primary-ink)}
.c-h .sp{flex-grow:1}
.panes{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 110px)}
.pane{background:var(--surface);display:flex;flex-direction:column;min-width:0}
.queue{flex:1 1 240px;max-width:100%;border-right:1px solid var(--line)}
.conv{flex:999 1 420px;border-right:1px solid var(--line)}
.copilot{flex:1 1 380px;max-width:100%}
.p-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.p-h h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;flex-grow:1}
.qitem{display:flex;flex-direction:column;gap:3px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:13px;width:100%}
.qitem[aria-current="true"]{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--ink)}
.qitem:disabled{cursor:default;color:var(--ink-2)}
.sev{align-self:flex-start;padding:1px 6px;border:1.5px solid var(--bad);color:var(--bad);border-radius:4px;font-size:11px;font-weight:700}
.sev.done{border-color:var(--ok);color:var(--ok)}
.msgs{flex-grow:1;padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.cm{max-width:80%;display:flex;flex-direction:column;gap:4px}
.cm .b{padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--surface-2)}
.am{align-self:flex-end;align-items:flex-end}
.am .b{border-radius:12px 12px 2px 12px;background:var(--surface);border:1.5px solid var(--line-strong)}
.sys{align-self:center;max-width:90%;font-size:12px;color:var(--ink-2);text-align:center}
.reply{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.reply textarea{width:100%;min-height:72px;resize:vertical;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.cp-b{flex-grow:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.cp-sec{display:flex;flex-direction:column;gap:8px}
.cp-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.policy{padding:12px;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.policy blockquote{margin:0;padding-left:10px;border-left:3px solid var(--line-strong)}
.action{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.action[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;margin-top:2px}
.action[aria-checked="true"] .radio{border:6px solid var(--ink)}
.conf{padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);font-size:12px;font-weight:600}
.cp-f{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px}
.cp-f .btn{flex:1 1 150px}
.modalwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
.modal{width:min(440px,100%);background:var(--surface);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--ink)}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:6px;background:var(--primary);color:var(--primary-ink);font-size:13px;font-weight:600}
.trackcard{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:13px}
.done-banner{margin:16px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--ok);display:flex;flex-direction:column;gap:4px}
.facts{border:1.5px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.facts div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.facts div:first-child{border-top:0;background:var(--surface-2);font-weight:600}
.facts span{padding:7px 10px;overflow-wrap:anywhere}
.verified{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--accent);border-radius:999px;background:transparent;color:var(--accent);font-size:12px;font-weight:600;min-height:32px}

details.how{font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px}
details.how summary{cursor:pointer;min-height:28px;display:flex;align-items:center}

details.how dt{font-weight:600;color:var(--ink)}details.how dd{margin:0;overflow-wrap:anywhere}
details.calc-d summary{cursor:pointer;color:var(--accent);font-size:13px;text-decoration:underline;min-height:28px;display:flex;align-items:center}
/* ===================== High fidelity: CartesianRAG design system v1 =====================
   Overrides the wireframe rules above. Component names follow the design system. */
body{font-size:15px;line-height:1.47}
h1,h2,h3,.start h1,.task h2{font-family:var(--font-display);letter-spacing:-.01em}
.dot.warn{background:transparent!important;border:2px solid var(--warn)}
.dot.bad{background:transparent!important;border:2px dashed var(--bad)}
.bar{background:var(--line)}
/* Button */
.btn{border-radius:10px;font-size:15px}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.primary,.btn.accent{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover,.btn.accent:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.secondary{background:var(--lantern);border-color:var(--lantern);color:var(--on-lantern)}
.btn.secondary:hover{background:#e9b53e;border-color:#e9b53e}
.btn[disabled]{opacity:1;background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.btn.sm{font-size:14px}
/* Chips: full text, wrapping (R11); selected = lantern */
.chips{flex-wrap:wrap;overflow:visible}
.chips .chip,.chip{flex-shrink:1;white-space:normal;text-align:left;line-height:18px;padding:7px 14px;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--primary);color:var(--ink);background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--lantern);color:var(--on-lantern);border-color:var(--on-lantern);font-weight:600}
.reqs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.req{display:inline-flex;align-items:center;gap:2px;min-height:32px;padding:3px 4px 3px 12px;border-radius:999px;background:var(--accent-soft);border:1.5px solid var(--primary);font-size:13px;font-weight:500}
.req.fixed{padding-right:12px}
.req button{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border:0;border-radius:999px;background:transparent;color:var(--ink)}
.req button:hover{background:var(--surface)}
/* Tag (rare campfire accent) */
.promo{display:inline-flex;align-self:flex-start;padding:2px 8px;border-radius:6px;background:var(--campfire);color:var(--on-campfire);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pick-tag{display:inline-flex;padding:2px 8px;border-radius:6px;background:var(--lantern);color:var(--on-lantern);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
/* Receipts: their own paper style (old .cite and .verified both become receipts) */
.verified,.cite{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 10px 3px 8px;border-radius:6px;border:1.5px dashed var(--receipt-edge);background:var(--receipt-paper);color:var(--ink);font-family:var(--font-sans);font-size:13px;font-weight:600}
.verified:hover,.cite:hover{border-style:solid;background:var(--receipt-paper)}
.verified .ck{color:var(--receipt-check);font-weight:800}
.verified .mono{font-size:11px;font-weight:400;opacity:1;color:var(--ink-2)}
.cite{font-family:var(--font-mono);font-size:11px;font-weight:500}
/* Facilitator bar: bark, with a lantern edge, so it never looks like part of the store */
.fbar{background:var(--ink);color:#f3ece3;border-bottom:3px solid var(--lantern)}
body::before{background:var(--ink)}
/* Storefront */
.store-h{background:var(--surface)}
.logo{width:auto;height:auto;border:0;padding:0;font:700 20px/1 var(--font-display);letter-spacing:-.01em;color:var(--ink);gap:6px;text-transform:none}
.logo .spark{width:9px;height:9px;border-radius:999px;background:var(--campfire)}
.store-hero{display:flex;flex-direction:column;gap:6px}
.store-hero h1{font-size:34px;line-height:1.1}
.tile{border-radius:16px;padding:12px;gap:4px;box-shadow:var(--shadow-card);font-size:14px}
.tile .ph{aspect-ratio:auto;height:132px;border-radius:10px;color:var(--ink-2)}
.tile b{font-weight:600}
.tile .price{font-size:15px}
.launcher{background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow-pop)}
/* Assistant */
.widget{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);background:var(--surface)}
.w-h h2{font-size:17px}
.w-status{font-size:13px}
.w-status .sp{flex-grow:1}
.w-status .dot{background:var(--ok)}
.w-status .dot.rec{background:transparent;border:2px solid var(--ink-2)}
.w-status button{white-space:nowrap;flex-shrink:0;min-height:28px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink)}
.w-status button[aria-pressed="true"]{background:var(--lantern);border-color:var(--on-lantern)}
.u{background:var(--accent-soft)}
/* Product card */
.card{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-card);padding:16px;gap:12px}
.card.top{border-color:var(--line)}
.card h3{font-family:var(--font-display);font-size:17px;line-height:22px}
.thumb{border:0;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.spec{border:0;background:var(--surface-2);border-radius:6px;font-size:13px;color:var(--ink)}
.stock{font-size:14px}
.stock.ok b,.stock.ok{color:var(--ok)} .stock.warn b{color:var(--warn)} .stock.bad b{color:var(--bad)}
.stock .where{color:var(--ink-2)}
.stepper{border-radius:10px;background:var(--surface)}
.stepper button:hover{background:var(--surface-2)}
.hold{border-top:1px solid var(--line);padding-top:12px}
.hold .warnline{color:var(--warn)}
.confirm{border:1.5px solid var(--lantern);background:var(--lantern-soft);border-radius:10px}
.lockbadge{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px}
.warnbox{border-left:0;background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.colours{font-size:13px;color:var(--ink-2)}
/* Notices */
.notice{border:1.5px solid var(--line-strong);background:var(--surface-2);border-radius:10px}
.nomatch{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:10px;background:var(--warn-soft)}
.nomatch .btn{align-self:flex-start;text-align:left}
/* Answer fact (R6) */
.fact{display:flex;flex-direction:column;gap:6px}
.fact .n{font:700 34px/38px var(--font-display);font-variant-numeric:tabular-nums}
/* Waiting card */
.prog{border-radius:16px;box-shadow:none}
.prog .row b{font-family:var(--font-display);font-size:17px}
.steps .m.done{background:var(--primary);border-color:var(--primary)}
.steps .m.now{background:var(--lantern);border-color:var(--on-lantern)}
.prog .steps .m.now{animation:hpulse 1.4s ease-in-out infinite}
@keyframes hpulse{50%{box-shadow:0 0 0 5px var(--lantern-soft)}}
@media (prefers-reduced-motion:reduce){.prog .steps .m.now{animation:none}}
/* Drawer = receipt paper */
.drawer{background:var(--receipt-paper);border-left:0;box-shadow:var(--shadow-pop)}
.d-h{border-bottom:1.5px dashed var(--receipt-edge)}
.d-h h2{font-family:var(--font-display);font-size:17px;letter-spacing:0;text-transform:none}
.kpi,.kv{background:var(--surface)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--primary)}
/* Console */
.c-h{background:var(--primary);color:var(--primary-ink)}
.qitem[aria-current="true"]{box-shadow:inset 4px 0 0 var(--primary)}
.sev{border-color:var(--bad);color:var(--bad)}
.sev.done{border-color:var(--ok);color:var(--ok)}
.action[aria-checked="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.action[aria-checked="true"] .radio{border-color:var(--primary)}
.conf{border-color:var(--primary);color:var(--primary)}
.modal{border:1px solid var(--line);box-shadow:var(--shadow-pop);border-radius:16px}
.toast{background:var(--ink);color:#f3ece3;border-radius:10px}
.done-banner{background:var(--ok-soft);border-color:var(--ok)}
.task{border-radius:16px;box-shadow:var(--shadow-card)}
.task .tag{color:var(--primary)}
details.how{font-size:13px}
@media (max-width:560px){.w-foot .chips .chip:nth-child(n+2){display:none}}
.visitor{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px;border-radius:12px;background:var(--lantern-soft);border:1.5px solid var(--lantern)}
.visitor span{flex:1 1 320px;font-size:14px}
.visitor a.btn{text-decoration:none;color:var(--ink)}
.fbar a.cs{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--lantern);color:var(--lantern);font-size:12px;font-weight:600;text-decoration:none}
.rec-tag{display:inline-block;padding:1px 6px;border:1px solid var(--line-strong);border-radius:4px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
</style>

/* ================= ENGINE MODE =================
   The widget can answer three ways:
   - "live":     ?api=http://localhost:8000 in the address -> calls the real Python engine
   - "recorded": answers.json exists (GitHub Pages)       -> replays REAL tickets the engine produced
   - "scripted": neither (e.g. the file opened directly)   -> the original hand-written demo

var ENGINE = { mode: "scripted", api: null, data: null, byQ: {}, byDrop: {}, tickets: {}, last: null, ready: false, details: false };

function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9$ ]+/g," ").replace(/\s+/g," ").trim(); }

function loadEngine(){
  var api = (location.search.match(/[?&]api=([^&]+)/) || [])[1];
  if(api){

    fetch(ENGINE.api + "/health").then(function(r){ return r.json(); }).then(function(h){

function loadRecorded(){

    ENGINE.data = d; ENGINE.byDrop = {};
    d.answers.forEach(function(a){
      if(a.drop) ENGINE.byDrop[norm(a.follows) + "|" + a.drop] = a;     // a recorded one-tap removal (R4, R5)
      else ENGINE.byQ[norm(a.question)] = a;

  }).catch(function(){ ENGINE.mode = "scripted"; ENGINE.ready = true; render(); });
}

  if(ENGINE.mode === "recorded") return '<span class="dot rec" aria-hidden="true"></span>Real answers, recorded ' + esc(niceDate(ENGINE.data.recorded_at)) + ', replayed for this demo' + detailsToggle();
  return '<span class="dot" aria-hidden="true"></span>Connected to live inventory · synced 2 min ago';
}
function demoQuestions(){

}
function engineChips(limit){
  var asked = {}; S.msgs.forEach(function(m){ if(m.who === "u") asked[norm(m.text)] = 1; });
  return demoQuestions().filter(function(q){ return !asked[norm(q)]; }).slice(0, limit).map(function(q){
    return '<button type="button" class="chip" data-a="chipQuery" data-q="' + esc(q) + '">' + esc(q) + '</button>';
  }).join("");

/* R3: an honest waiting state. The real engine takes 6–40 s on a home PC, almost all of it the small AI
   model writing. Recorded answers replay their REAL step timings (from timing_ms) at 4× speed, labelled,
   with a skip button. Live mode shows a real timer; the engine reports its steps only at the end today. */
var REPLAY_SPEED = 4;
function replaySteps(t){
  var tm = t.timing_ms || {}, total = tm.total || 0, st = (t.trace || {}).station;
  var gen = tm.generation || 0, ret = tm.retrieval || 0;
  if(st === "hybrid") return [["Reading your request (small AI model)", total - ret], ["Checking stock, prices and delivery in 5 warehouses", ret]];
  if(st === "sql") return [["Turning your question into a database query (small AI model)", total - ret], ["Looking it up", ret]];
  if(st === "search") return [["Working out what kind of question this is", total - ret], ["Searching the catalog by meaning and by keyword", ret]];
  return [["Understanding your request", total]];
}
function progressHtml(m){
  var real = (Date.now() - m.started) * (m.speed || 1), steps = m.steps, i = 0, acc = 0;
  if(steps){ for(i = 0; i < steps.length; i++){ acc += steps[i][1]; if(real < acc) break; } }
  var timer = '<span class="timer" id="prog-t" aria-hidden="true">' + mmss(Math.floor(real / 1000)) + '</span>';
  var list = steps ? '<ol class="steps">' + steps.map(function(s, j){
      var c = j < i ? "done" : (j === i ? "now" : "");
      return '<li><span class="m ' + c + '" aria-hidden="true"></span><span>' + (j < i ? '<b>' + esc(s[0]) + '</b>' : esc(s[0])) + '</span></li>'; }).join("") + '</ol>'
    : '<ol class="steps"><li><span class="m now" aria-hidden="true"></span><span>Working on your answer</span></li></ol>';
  var note = m.speed > 1
    ? 'Demo replay at ' + m.speed + '× speed. The real engine took <b>' + (m.realTotal / 1000).toFixed(1) + ' s</b> on a home PC.'
    : (real > 20000 ? 'Still working. Questions with many requirements take the longest.' : 'A small AI model on a home PC usually takes 6–40 s.');
  return '<div class="card prog"><div class="row between"><b>Working on it</b>' + timer + '</div>' + list
    + '<span class="muted" style="font-size:12px">' + note + '</span>'
    + (m.speed > 1 ? '<div><button type="button" class="btn sm" data-a="skipWait">Skip the wait</button></div>' : "") + '</div>';
}
function startProgress(m, ticket, meta){
  m.who = "a"; m.kind = "progress"; m.started = Date.now(); m._step = -1;
  S.msgs.push(m); ENGINE.pending = {msg: m, ticket: ticket, meta: meta}; render("ask");
}
function finishPending(){
  var p = ENGINE.pending; if(!p) return; ENGINE.pending = null;
  var i = S.msgs.indexOf(p.msg); if(i < 0) return;            // the shopper left the task meanwhile
  S.msgs.splice(i, 1); if(p.ticket) showTicket(p.ticket, p.meta); else render("ask");
}
setInterval(function(){
  var p = ENGINE.pending; if(!p) return;
  var m = p.msg, real = (Date.now() - m.started) * (m.speed || 1);
  if(m.speed > 1 && real >= m.realTotal){ finishPending(); return; }
  var box = document.getElementById("prog"); if(!box) return;
  var steps = m.steps || [], i = 0, acc = 0;
  for(i = 0; i < steps.length; i++){ acc += steps[i][1]; if(real < acc) break; }
  var stale = m.speed === 1 && real > 20000 && !m._late;
  if(i !== m._step || stale){ m._step = i; if(stale) m._late = true; box.innerHTML = progressHtml(m); }
  else { var tEl = document.getElementById("prog-t"); if(tEl) tEl.textContent = mmss(Math.floor(real / 1000)); }
}, 250);

function engineAsk(text){
  if(ENGINE.pending){ flash("Wait for the current answer, or skip the wait"); return; }
  S.draft = ""; S.msgs.push({who:"u", text:text}); log("asked: " + text);
  if(ENGINE.mode === "live"){
    var lm = {speed:1}; startProgress(lm, null, null);
    var t0 = Date.now();
    fetch(ENGINE.api + "/ask", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({question:text, previous:ENGINE.last})})
      .then(function(r){ return r.json(); })
      .then(function(ticket){ ENGINE.pending.ticket = ticket; ENGINE.pending.meta = {waited_ms: Date.now() - t0}; finishPending(); })
      .catch(function(){ ENGINE.pending = null; var i = S.msgs.indexOf(lm); if(i >= 0) S.msgs.splice(i, 1); S.msgs.push({who:"a", kind:"text", html:"The engine didn't answer. Is <span class=\"mono\">uvicorn</span> running?"}); render("ask"); });
    return;
  }
  var hit = ENGINE.byQ[norm(text)];
  if(!hit){
    S.msgs.push({who:"a", kind:"text", html:"This online demo replays answers the real engine gave. Try one of these questions:"
      + '<span class="chips" style="flex-wrap:wrap;margin-top:8px">' + engineChips(6) + '</span>'});
    log("not in recording: " + text); render("ask"); return;
  }
  var real = Math.max(hit.ticket.timing_ms.total, 1600);       // even instant answers show their step briefly
  startProgress({speed: REPLAY_SPEED, steps: replaySteps(hit.ticket), realTotal: real}, hit.ticket, {recorded:true, follows: hit.follows});
}
var DROP_WORDS = {quantity:"the quantity", category:"the category", color:"the colour", material:"the material", armrests:"the armrest type",
  max_unit_price:"the price limit", destination_city:"the delivery city", max_delivery_days:"the delivery-time limit", single_depot:"the one-warehouse rule"};
/* R4 + R5: ask again with one requirement removed. Live: the engine re-runs the same form minus that box (no AI).
   Recorded: replay the removal the engine recorded for this answer. */
function engineDrop(qid, field){
  if(ENGINE.pending){ flash("Wait for the current answer, or skip the wait"); return; }
  var src = ENGINE.tickets[qid]; if(!src) return;
  var label = "Without " + (DROP_WORDS[field] || field);
  S.msgs.push({who:"u", text: label}); log("removed requirement: " + field);
  if(ENGINE.mode === "live"){
    var lm = {speed:1}; startProgress(lm, null, null); var t0 = Date.now();
    fetch(ENGINE.api + "/ask", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({question: label, previous: src.constraints, drop: field})})
      .then(function(r){ return r.json(); })
      .then(function(ticket){ ENGINE.pending.ticket = ticket; ENGINE.pending.meta = {waited_ms: Date.now() - t0, follows: src.question}; finishPending(); })
      .catch(function(){ ENGINE.pending = null; var i = S.msgs.indexOf(lm); if(i >= 0) S.msgs.splice(i, 1); S.msgs.push({who:"a", kind:"text", html:"The engine didn\u2019t answer. Is <span class=\"mono\">uvicorn</span> running?"}); render("ask"); });
    return;
  }
  var hit = ENGINE.byDrop[norm(src.question) + "|" + field];
  if(!hit){ S.msgs.push({who:"a", kind:"text", html:"That change wasn\u2019t recorded for this demo."}); render("ask"); return; }
  startProgress({speed: REPLAY_SPEED, steps: [["Removing that requirement and checking stock again", hit.ticket.timing_ms.total]], realTotal: 1600},
                hit.ticket, {recorded:true, follows: src.question});
}
function showTicket(ticket, meta){
  ticket = JSON.parse(JSON.stringify(ticket)); ticket._meta = meta || {};

  if(ticket.constraints) ENGINE.last = ticket.constraints;
  S.msgs.push({who:"a", kind:"ticket", qid: ticket.query_id});

function friendly(msg){ return String(msg).replace(/pass(es)? every rule/g, function(m, es){ return es ? "matches everything you asked for" : "match everything you asked for"; })

function stockWords(st){ return {in_stock:["ok","In stock"], low_stock:["warn","Low stock"], out_of_stock:["bad","Out of stock"]}[st.status] || ["ok", st.status]; }
function receiptButton(t, cid, label){
  var c = (t.citations || []).filter(function(x){ return x.id === cid; })[0]; if(!c) return "";

var TABLE_WORDS = { stock_available: "inventory", products: "products", orders: "orders", delivery_times: "delivery" };
var REQ_ORDER = ["quantity","product_name","category","color","material","armrests","max_unit_price","destination_city","max_delivery_days","single_depot"];
function reqLabel(k, v){

    case "quantity": return v + (v === 1 ? " unit" : " units");

/* R4: the requirements the engine is using, as chips. x = ask again without that one (no AI, milliseconds). */
function reqChips(t){

function factHtml(t){

function ticketHtml(t){

  if(t.state === "no_results" && t.relax && t.relax.length){
    var ways = t.relax.filter(function(o){ return ENGINE.mode === "live" || ENGINE.byDrop[norm(t.question) + "|" + o.field]; });
    h += '<div class="nomatch"><b>Nothing matches everything you asked for right now.</b>'
      + (ways.length ? '<span style="font-size:14px">These would match if you let go of one thing:</span>' + ways.map(function(o, i){
          return '<button type="button" class="btn ' + (i === 0 ? "secondary" : "") + ' sm" data-a="drop" data-q="' + esc(t.query_id) + '" data-f="' + esc(o.field) + '">Show ' + o.matches + ' option' + (o.matches > 1 ? "s" : "") + ' without ' + esc(o.label) + '</button>'; }).join("")
        : '<span style="font-size:14px">' + esc(friendly(t.message).replace(/^Nothing matches[^.]*\.\s*/, "")) + '</span>') + '</div>';
  } else if(fact){
    h += fact;
  } else if(!isHandoff){
    h += '<p>' + esc(friendly(t.message)) + '</p>';
  }
  if(t.relax && t.state === "answer") t.relax.forEach(function(o){
    if(ENGINE.mode === "live" || ENGINE.byDrop[norm(t.question) + "|" + o.field])
      h += '<button type="button" class="btn secondary sm" style="align-self:flex-start" data-a="drop" data-q="' + esc(t.query_id) + '" data-f="' + esc(o.field) + '">Also show options that ship from several warehouses</button>';
  });
  (t.components || []).forEach(function(c){
    if(c.type === "product_card") h += ticketCard(c, t);
    else if(c.type === "choices") h += '<div role="group" aria-label="' + esc(c.prompt) + '" style="display:flex;flex-direction:column;gap:8px">' + c.options.map(function(o){
        return '<button type="button" class="pick" data-a="chipQuery" data-q="' + esc(o.follow_up_question) + '"><b>' + esc(o.label) + '</b>' + (o.description ? '<span class="muted" style="font-size:12px">' + esc(o.description) + '</span>' : "") + '</button>'; }).join("") + '</div>';
    else if(c.type === "handoff") h += '<div class="notice"><b>Connecting you to a specialist</b><span>They’ll see this conversation, so you won’t need to repeat anything.</span></div>';
  });
  var cards = (t.components || []).some(function(c){ return c.type === "product_card"; });
  if(fact && t.citations && t.citations.length) h += '<div class="row">' + receiptButton(t, t.citations[0].id) + '</div>';
  if(!cards && !fact && t.table && t.table.rows && t.table.rows.length && t.state === "answer"){
    // Show the most useful columns: drop the sku code when a readable name exists, then keep the LAST 4
    // (the answer, like "total", is usually the last column; showing only the first 4 hid it).
    var all = t.table.columns, idx = all.map(function(c, i){ return i; });
    if(all.indexOf("name") >= 0 && all.indexOf("sku") >= 0) idx = idx.filter(function(i){ return all[i] !== "sku"; });
    idx = idx.slice(-4);
    var grid = 'style="grid-template-columns:repeat(' + idx.length + ',minmax(0,1fr))"';
    h += '<div class="facts">' + '<div ' + grid + '>' + idx.map(function(i){ return '<span>' + esc(all[i].replace(/_/g," ")) + '</span>'; }).join("") + '</div>'
      + t.table.rows.slice(0,5).map(function(r){ return '<div ' + grid + '>' + idx.map(function(i){ var v = r[i]; return '<span>' + esc(v === null ? "—" : v) + '</span>'; }).join("") + '</div>'; }).join("") + '</div>';
    if(t.citations && t.citations.length) h += '<div class="row">' + receiptButton(t, t.citations[0].id) + '</div>';
  }
  if(t.calculation){
    var ins = t.calculation.inputs || {};
    h += '<details class="calc-d"><summary>Show calculation</summary><div class="calc">' + esc(t.calculation.formula) + '\n'
      + Object.keys(ins).map(function(k){ return esc(k) + " = " + esc(ins[k]); }).join("\n") + '\nresult = ' + esc(t.calculation.result) + '</div></details>';
  }
  var tr = t.trace || {}, tm = t.timing_ms || {}, m = t._meta || {};
  if(!ENGINE.details) return h + '</div>';           // R10: engine details only when switched on
  h += '<details class="how"><summary>How this was answered' + (m.recorded ? ' &nbsp;<span class="rec-tag">recorded</span>' : "") + '</summary><dl>'
    + '<dt>Station</dt><dd>' + esc(tr.station || t.route) + '</dd>'
    + '<dt>Why</dt><dd>' + esc(tr.router_reason || "—") + '</dd>'
    + '<dt>Confidence</dt><dd>' + esc(t.confidence) + '</dd>'
    + (ENGINE.mode === "recorded" ? '<dt>Model</dt><dd>' + esc(ENGINE.data.preset === "ai" ? (ENGINE.data.model || "local model") : "rules only, no AI") + '</dd>' : "")
    + '<dt>Engine time</dt><dd>' + (tm.total / 1000).toFixed(2) + ' s' + (tm.generation ? ' (AI ' + (tm.generation / 1000).toFixed(2) + ' s)' : "") + '</dd>'
    + (tr.sql ? '<dt>SQL</dt><dd class="mono">' + esc(tr.sql) + '</dd>' : "")
    + (t.constraints ? '<dt>Form</dt><dd class="mono">' + esc(JSON.stringify(t.constraints)) + '</dd>' : "")
    + '</dl></details>';
  return h + '</div>';
}
function ticketDrawerHtml(d){
  var t = ENGINE.tickets[d.qid]; if(!t) return "";
  var c = (t.citations || []).filter(function(x){ return x.id === d.cid; })[0]; if(!c) return "";
  var fields = c.fields || {};
  var rows = Object.keys(fields).map(function(k){ return '<div><span>' + esc(k) + '</span><span>' + esc(fields[k] === null ? "—" : fields[k]) + '</span></div>'; }).join("");
  var when = new Date(c.read_at), mins = Math.round((Date.now() - when) / 60000);
  var ago = (t._meta && t._meta.recorded) ? "at recording" : (mins < 1 ? "just now" : mins + " min ago");
  return '<div class="scrim" data-a="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Source verification" id="drawer">'
    + '<div class="d-h"><h2>Where this number came from</h2><button type="button" class="iconbtn" aria-label="Close" data-a="closeDrawer" id="drawerClose">' + ICON.x + '</button></div>'
    + '<div class="d-b"><div style="display:flex;flex-direction:column;gap:4px"><span class="label">Read from the store\u2019s database</span><b style="font-size:17px">' + esc(fields.name || (c.row_key && (c.row_key.sku || c.row_key.aggregate)) || c.table) + '</b></div>'
    + '<div class="kpis"><div class="kpi"><span class="muted" style="font-size:12px">Grounding confidence</span><b>' + esc(c.confidence != null ? c.confidence : t.confidence) + '</b><span class="muted" style="font-size:12px">' + (c.kind === "db_row" ? "Read straight from the database" : "From a document") + '</span></div>'
    + '<div class="kpi"><span class="muted" style="font-size:12px">Read</span><b style="font-size:16px">' + ago + '</b><span class="mono muted" style="font-size:11px">' + esc(c.read_at) + '</span></div></div>'
    + '<p class="muted" style="margin:0;font-size:13px">Database <span class="mono">' + esc(c.database || "") + '</span> · table <span class="mono">' + esc(c.table || "") + '</span></p>'
    + (rows ? '<div class="kv"><div><span>Field</span><span>Value</span></div>' + rows + '</div>' : "")
    + (c.sql ? '<div style="display:flex;flex-direction:column;gap:6px"><span class="label">Executed SQL</span><pre class="sql">' + esc(c.sql) + '</pre></div>' : "")
    + '</div><div class="d-f"><button type="button" class="btn" data-a="closeDrawer">Close</button><button type="button" class="btn primary" data-a="copyTicket" data-q="' + esc(t.query_id) + '">Copy ticket (JSON)</button></div></aside>';
}
/* ================= end ENGINE MODE ================= */

/* ---------- shopper logic ---------- */
function ask(text){
  text=text.trim(); if(!text) return;
  if(ENGINE.mode!=="scripted"){ engineAsk(text); return; }
  S.draft=""; S.msgs.push({who:"u",text:text}); log("asked: "+text);
  var kind, wait=1100, label="Checking live inventory…";
  if(/refund|late|angry|cancel|chargeback|complain/i.test(text)) { kind="handoff"; wait=700; label="Understanding your request…"; }
  else if(/track|my order|recent order/i.test(text)) { kind="track"; label="Looking up your order…"; }
  else if(/shell/i.test(text) && !/chair/i.test(text)) { kind="disambig"; wait=800; label="Searching the catalog…"; }
  else if(/eta|arrive|deliver/i.test(text) && !/chair.*navy|navy.*chair|mesh/i.test(text)) { kind="eta"; label="Checking delivery times…"; }
  else if(/chair|mesh|navy|armrest|4d|seat/i.test(text)) kind="results";
  else kind="fallback";
  S.msgs.push({who:"a",kind:"loading",text:label}); render("ask");
  setTimeout(function(){
    S.msgs.pop();
    if(kind==="eta") S.msgs.push({who:"a",kind:"text",html:"From the Indianapolis depot, 40 AeroTask Pro chairs (navy) arrive in Chicago by <b>Monday 11:00 AM</b> if reserved today. <button type=\"button\" class=\"cite\" data-a=\"drawer\" data-k=\"AT\">Source: row_441 | depot_schedule</button>"});
    else if(kind==="fallback") S.msgs.push({who:"a",kind:"text",html:"I can help with product specs, stock, prices and orders. Try describing what you need, for example how many, which colour, your budget and a delivery date."});
    else S.msgs.push({who:"a",kind:kind});
    log("answer shown: "+kind);
    render("ask");
  }, wait);
}

/* ---------- actions ---------- */
function act(a, el){
  switch(a){
    case "go": setView(el.dataset.v); return true;
    case "home": log("left task"); setView("start"); return;
    case "restart": setView(S.view); return;
    case "toggleLog": S.showLog=!S.showLog; render(); return;
    case "clearLog": S.log=[]; render(); return;
    case "copyLog":
      var txt=S.log.map(function(l){return l.task+"\t"+mmss(l.t)+"\t"+l.evt;}).join("\n");
      try{ navigator.clipboard.writeText(txt).then(function(){flash("Log copied");},function(){flash("Copy blocked — select the log text instead");}); }catch(e){ flash("Copy blocked — select the log text instead"); }
      return;
    case "openWidget": S.widgetOpen=true; log("opened assistant"); render("ask"); return;
    case "closeWidget": S.widgetOpen=false; log("closed assistant"); render(); return;
    case "chipQuery": log("chip: "+el.dataset.q); ask(el.dataset.q); return;
    case "variant": S.variant=el.dataset.v; log("variant → "+S.variant+" (stock "+cur().stock+")"); render(); return;
    case "qty": if(S.lockEnd) return; S.qty=Math.max(1,S.qty+Number(el.dataset.d)); log("qty → "+S.qty); render(); return;
    case "calc": S.showCalc=!S.showCalc; log((S.showCalc?"opened":"closed")+" calculation log"); render(); return;
    case "compare": S.msgs.push({who:"u",text:"Compare these side by side"}); S.msgs.push({who:"a",kind:"compare"}); log("opened comparison"); render(); return;
    case "diffOnly": S.diffOnly=el.checked; log("differences only: "+S.diffOnly); render("diffOnly"); return;
    case "pickMatch":
      log("disambiguation pick: "+el.dataset.m);
      if(el.dataset.m==="chair"){ S.msgs.push({who:"u",text:"Navy mesh office chair"}); S.msgs.push({who:"a",kind:"results"}); }
      else { S.msgs.push({who:"u",text:el.textContent.trim()}); S.msgs.push({who:"a",kind:"text",html:"That product isn’t part of this prototype. Try the navy mesh office chair instead."}); }
      render(); return;
    case "handoff": log("asked for a person"); S.msgs.push({who:"a",kind:"handoff"}); render(); return;
    case "reserve": S.confirmReserve=true; log("clicked reserve"); render(); return;
    case "cancelReserve": S.confirmReserve=false; log("cancelled reserve"); render(); return;
    case "confirmReserve":
      S.confirmReserve=false; S.lockEnd=Date.now()+15*60*1000; S.msgs.push({who:"a",kind:"locked"});
      S.doneAt=Date.now(); log("TASK A COMPLETE — reserved "+S.qty+" "+S.variant+" at "+mmss(elapsed())); S.taskDone=true; render(); return;
    case "eqty": if(S.hold) return; var q=S.eq[el.dataset.k]; q.qty=Math.max(1,q.qty+Number(el.dataset.d)); log("engine card qty → "+q.qty); render(); return;
    case "eHold": S.eq[el.dataset.k].confirm=true; log("clicked hold on "+el.dataset.k.split("|")[1]); render(); return;
    case "eCancel": S.eq[el.dataset.k].confirm=false; log("cancelled hold"); render(); return;
    case "eConfirm":
      var hk=el.dataset.k, hq=S.eq[hk]; hq.confirm=false; S.hold={key:hk, qty:hq.qty}; S.lockEnd=Date.now()+15*60*1000;
      S.doneAt=Date.now(); log("TASK A COMPLETE — held "+hq.qty+" × "+hk.split("|")[1]+" at "+mmss(elapsed())); S.taskDone=true; render(); return;
    case "drop": engineDrop(el.dataset.q, el.dataset.f); return;
    case "engineDetails": ENGINE.details = !ENGINE.details; try{ localStorage.setItem("cr-details", ENGINE.details ? "1" : ""); }catch(e){} log("engine details " + (ENGINE.details ? "on" : "off")); render(); return;
    case "skipWait": if(ENGINE.pending){ log("skipped the wait"); finishPending(); } return;
    case "copyTrack": flash("Tracking link copied (sample)"); log("copied tracking link"); return;
    case "tdrawer":
      lastFocus=el; S.drawer={k:"ticket", qid:el.dataset.q, cid:el.dataset.c}; log("opened receipt "+el.dataset.c+" of "+el.dataset.q); render("drawerClose"); return;
    case "copyTicket":
      var tk=JSON.parse(JSON.stringify(ENGINE.tickets[el.dataset.q])); delete tk._meta;
      try{ navigator.clipboard.writeText(JSON.stringify(tk,null,2)).then(function(){flash("Ticket copied");},function(){flash("Copy blocked by the browser");}); }catch(e){ flash("Copy blocked by the browser"); }
      return;
    case "drawer":
      lastFocus=el; S.drawer={k:el.dataset.k, tab:Number(el.dataset.tab||0)}; log("opened source drawer: "+el.dataset.k+(el.dataset.tab?" tab "+el.dataset.tab:"")); render("drawerClose"); return;
    case "tab": S.drawer.tab=Number(el.dataset.i); log("drawer tab "+el.dataset.i); render("drawerClose"); return;
    case "closeDrawer": S.drawer=null; log("closed source drawer"); render(); if(lastFocus&&lastFocus.dataset){ var sel='[data-a="'+lastFocus.dataset.a+'"][data-k="'+lastFocus.dataset.k+'"]'; var b=document.querySelector(sel); if(b) b.focus(); } return;
    case "export": flash("Audit log exported (prototype: no file is created)"); log("export audit log"); return;
    /* agent */
    case "accept":
      S.agentPhase="loading"; log("accepted ticket"); render();
      setTimeout(function(){ if(S.view!=="agent") return; S.agentPhase="ready"; log("co-pilot loaded"); render(); }, 900); return;
    case "pickAction": S.action=el.dataset.v; S.confirmExec=false; log("selected action: "+S.action); render(); return;
    case "insert": S.reply=DRAFTS[S.action]; log("inserted draft ("+S.action+")"); render("reply"); return;
    case "exec": syncReply(); S.confirmExec=true; log("clicked execute ("+S.action+")"); render(); return;
    case "cancelExec": S.confirmExec=false; log("cancelled execute"); render(); return;
    case "confirmExec":
      syncReply(); var text=S.reply.trim()||DRAFTS[S.action];
      S.convo.push({who:"a",name:"Marcus",time:"14:04",text:text});
      if(S.action==="reship") S.convo.push({who:"track"}); else S.convo.push({who:"sys",text:"Refund of order total issued · return fee waived"});
      S.agentPhase="done"; S.confirmExec=false; S.doneAt=Date.now(); S.resolvedAt=elapsed(); S.taskDone=true; S.reply="";
      S.toast=(S.action==="reship"?"Priority reship dispatched":"Refund issued")+" · logged to audit ledger";
      log("TASK B COMPLETE — "+S.action+" at "+mmss(S.resolvedAt)+(text===DRAFTS[S.action]?" (draft unedited)":" (draft edited)"));
      render();
      setTimeout(function(){ if(S.view!=="agent") return; S.toast=null; S.convo.push({who:"c",name:"David",time:"14:05",text:"Okay, tomorrow by 10 works. Thank you."}); render(); },2600);
      return;
    case "escalate": log("escalated to Tier-2"); S.toast="Escalated to Tier-2 with summary, SQL logs and customer context"; render(); setTimeout(function(){S.toast=null; render();},2600); return;
  }
}
function syncReply(){ var r=document.getElementById("reply"); if(r) S.reply=r.value; }
function flash(msg){ var keep=S.toast; S.toast=msg; if(S.view==="agent"){ render(); setTimeout(function(){S.toast=keep;render();},2200); return; }
  var t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el||el.disabled) return;
  if(el.tagName==="INPUT") return;
  if(el.tagName==="A") e.preventDefault();
  act(el.dataset.a, el);
});
document.addEventListener("change",function(e){
  if(e.target.id==="diffOnly") act("diffOnly", e.target);
  if(e.target.classList && e.target.classList.contains("eqty-in")){ var en=parseInt(e.target.value,10), eq=S.eq[e.target.dataset.k]; if(eq&&!isNaN(en)&&en>0){ eq.qty=en; log("engine card qty typed → "+en);} render(); }
  if(e.target.id==="qty"){ var n=parseInt(e.target.value,10); if(!isNaN(n)&&n>0){ S.qty=n; log("qty typed → "+n);} render(); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="ask") S.draft=e.target.value;
  if(e.target.id==="reply") S.reply=e.target.value;
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target.dataset.form;
  if(f==="ask"){ ask(document.getElementById("ask").value); }
  if(f==="reply"){ syncReply(); if(!S.reply.trim()) return; S.convo.push({who:"a",name:"Marcus",time:"14:04",text:S.reply}); log("sent reply without action"); S.reply=""; render(); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&S.drawer){ act("closeDrawer",{}); } });
window.addEventListener("hashchange",function(){ var v=viewFromHash(); if(v!==S.view) setView(v); });

if(S.view!=="start"){ S.t0=Date.now(); log("task started"); }
render(S.view==="agent"?"acceptBtn":null);
loadEngine();
})();
</script>
