<!-- @dsCard group="Actions" height=230 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;padding:16px;background:var(--canvas)}</style></head>
<body>
<div class="cr">
<div class="cr-stack">
<span class="cr-label cr-muted">Suggestion</span>
<div class="cr-row"><button class="cr-chip cr-chip--suggest" type="button">Same chairs, but they must arrive within 2 days</button><button class="cr-chip cr-chip--suggest" type="button">What would 40 cost in total?</button></div>
<span class="cr-label cr-muted">Requirement (removable)</span>
<div class="cr-row" aria-label="What I'm looking for"><span class="cr-chip cr-chip--req">40 units<button type="button" aria-label="Remove 40 units"><svg class="cr-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span><span class="cr-chip cr-chip--req">Navy<button type="button" aria-label="Remove navy"><svg class="cr-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span><span class="cr-chip cr-chip--req">Under $350 each<button type="button" aria-label="Remove under $350 each"><svg class="cr-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span><span class="cr-chip cr-chip--req">Chicago ≤ 2 days<button type="button" aria-label="Remove Chicago within 2 days"><svg class="cr-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></div>
<span class="cr-label cr-muted">Variant (colour)</span>
<div class="cr-row" role="group" aria-label="Colour"><button class="cr-chip cr-chip--variant" type="button" aria-pressed="false"><span class="cr-swatch" style="background:#2b2b2b"></span>Black · 31</button><button class="cr-chip cr-chip--variant" type="button" aria-pressed="true"><span class="cr-swatch" style="background:#1f2f57"></span>Navy · 48</button><button class="cr-chip cr-chip--variant" type="button" aria-pressed="false"><span class="cr-swatch" style="background:#8f8f8f"></span>Grey · 6</button></div>
</div>
</div>
</body>
</html>
